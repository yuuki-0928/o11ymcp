# Grafana起動時にClickHouseデータソースを自動登録する (ダッシュボードUIは自作せずGrafana+ClickHouse
# datasourceで代替する、という要件定義書/設計書の方針に対応)。
apiVersion: 1

datasources:
  - name: ClickHouse (o11y-mcp)
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      defaultDatabase: ${CLICKHOUSE_DB}
      username: ${CLICKHOUSE_USER}
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
